<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Media — News Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .news-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    .news-video-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow: hidden;
    }

    .news-video-container {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .news-video-container video {
      width: 100%;
      max-height: 50vh;
    }

    .news-info {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .news-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .news-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .news-upload-area {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .news-upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .news-upload-zone:hover,
    .news-upload-zone.dragover {
      border-color: var(--accent-blue);
      background: rgba(74, 124, 247, 0.05);
    }

    .news-upload-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .news-upload-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .news-segments-panel {
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .news-segments-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .news-segments-header h3 {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .news-segments-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .news-segment-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.12s;
    }

    .news-segment-card:hover {
      border-color: var(--border-light);
    }

    .news-segment-card.active {
      border-color: var(--accent-blue);
    }

    .news-segment-header {
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .news-segment-title {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }

    .news-segment-type {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--accent-blue-dim);
      color: var(--accent-blue);
      flex-shrink: 0;
    }

    .news-segment-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 12px 6px;
    }

    .news-segment-body {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--border);
    }

    .news-segment-card.expanded .news-segment-body {
      display: block;
      padding-top: 10px;
    }

    .news-segment-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .news-segment-transcript {
      font-size: 12px;
      color: var(--text-primary);
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }

    .news-progress-area {
      padding: 20px;
    }

    .skip-commercials-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 12px;
    }
  </style>
</head>
<body class="page-review">

  <header class="app-header">
    <div class="header-brand">
      <a href="/" class="brand-back" title="Back to Library">&larr;</a>
      <span class="brand-icon">&#x2B21;</span>
      <span class="brand-name">CIVIC MEDIA</span>
    </div>
    <div class="header-nav">
      <a href="/clips" class="nav-link">Clips</a>
      <span class="nav-badge" id="status-badge">&mdash;</span>
      <button class="btn btn-ghost btn-sm" id="shutdown-btn" title="Shutdown server" style="margin-left:8px;font-size:1.1em;padding:4px 8px;">&#x23FB;</button>
    </div>
  </header>

  <main class="news-layout">
    <div class="news-video-panel">
      <div class="news-info" id="news-info">
        <div class="news-title" id="news-title">Loading...</div>
        <div class="news-meta" id="news-meta">
          <button class="btn btn-ghost btn-sm clip-toggle-btn" id="clip-toggle-btn" title="Open Clip Builder" style="margin-left:auto">&#9986; Clip</button>
        </div>
      </div>

      <div class="news-video-container" id="video-container" style="display:none">
        <video id="news-video" controls></video>
      </div>

      <!-- Clip Builder Panel -->
      <div class="clip-builder" id="clip-builder" hidden>
        <div class="clip-builder-header">
          <span class="clip-builder-title">CLIP BUILDER</span>
          <button class="modal-close" id="clip-close-btn">&#x2715;</button>
        </div>
        <div class="clip-builder-body">
          <div class="clip-time-row">
            <label class="form-label">Start</label>
            <input type="text" class="form-input clip-time-input" id="clip-start-input" value="0:00:00.000" autocomplete="off">
            <button class="btn btn-ghost btn-sm" id="clip-set-start">Set Here</button>
          </div>
          <div class="clip-time-row">
            <label class="form-label">End</label>
            <input type="text" class="form-input clip-time-input" id="clip-end-input" value="0:00:00.000" autocomplete="off">
            <button class="btn btn-ghost btn-sm" id="clip-set-end">Set Here</button>
          </div>
          <div class="clip-duration-row">
            <span class="form-label">Duration</span>
            <span id="clip-duration-display" class="clip-duration-value">0:00</span>
          </div>

          <div class="clip-adjust-section">
            <span class="form-label">Adjust Start</span>
            <div class="clip-adjust-buttons">
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="-5">-5s</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="-1">-1s</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="-0.1">-.1</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="-0.033">-1f</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="0.033">+1f</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="0.1">+.1</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="1">+1s</button>
              <button class="btn btn-ghost btn-sm" data-which="start" data-delta="5">+5s</button>
            </div>
          </div>

          <div class="clip-adjust-section">
            <span class="form-label">Adjust End</span>
            <div class="clip-adjust-buttons">
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="-5">-5s</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="-1">-1s</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="-0.1">-.1</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="-0.033">-1f</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="0.033">+1f</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="0.1">+.1</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="1">+1s</button>
              <button class="btn btn-ghost btn-sm" data-which="end" data-delta="5">+5s</button>
            </div>
          </div>

          <div class="clip-preview-row">
            <button class="btn btn-ghost btn-sm" id="clip-preview-btn">&#9654; Preview</button>
            <label class="clip-loop-label">
              <input type="checkbox" id="clip-loop-check"> Loop
            </label>
          </div>

          <div class="clip-meta-row">
            <div class="form-group">
              <label class="form-label">Title</label>
              <input type="text" class="form-input" id="clip-title-input" placeholder="Untitled clip" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label">Notes</label>
              <input type="text" class="form-input" id="clip-notes-input" placeholder="Optional notes..." autocomplete="off">
            </div>
          </div>

          <div class="clip-actions-row">
            <button class="btn btn-primary" id="clip-export-btn">Export Clip</button>
            <span class="clip-status" id="clip-status"></span>
          </div>
        </div>
      </div>

      <div class="news-upload-area" id="upload-area">
        <div class="news-upload-zone" id="upload-zone">
          <div class="news-upload-label">Drop video file here or click to upload</div>
          <div class="news-upload-hint">MP4, MKV, AVI, TS, etc.</div>
        </div>
        <label class="skip-commercials-check">
          <input type="checkbox" id="skip-commercials">
          Skip commercial stripping
        </label>
        <input type="file" id="file-input" accept="video/*" style="display:none">
      </div>

      <div class="news-progress-area" id="progress-area" style="display:none">
        <div class="meeting-progress" id="progress-bar"></div>
      </div>
    </div>

    <div class="news-segments-panel">
      <div class="news-segments-header">
        <h3>Story Segments</h3>
        <span class="item-count" id="segment-count">&mdash;</span>
      </div>
      <div class="news-segments-list" id="segments-list">
        <div class="empty-state">No segments yet</div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById("shutdown-btn").addEventListener("click", async () => {
      if (!confirm("Shut down Civic Media server?")) return;
      try { await fetch("/api/system/shutdown", { method: "POST" }); } catch {}
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#888;"><div style="text-align:center"><h2>Server stopped</h2><p>Close this tab or restart with .\\start.ps1</p></div></div>';
    });
  </script>
  <script src="/static/news_review.js"></script>
</body>
</html>
