<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Posts — Civic Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .fb-layout {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Page sidebar */
    .fb-sidebar {
      flex: 0 0 220px;
      min-width: 0;
    }
    .fb-sidebar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .fb-page-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #bbb;
      transition: background 0.1s;
    }
    .fb-page-item:hover { background: rgba(255,255,255,0.05); }
    .fb-page-item.active { background: rgba(74,172,255,0.12); color: #4aacff; }
    .fb-page-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #666;
    }
    .fb-page-item.active .fb-page-count { color: #4aacff; }

    /* Main content */
    .fb-main { flex: 1 1 0; min-width: 0; }

    .fb-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 0 16px;
    }
    .fb-toolbar input[type="text"],
    .fb-toolbar input[type="date"] {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      color: #e0e0e0;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.82rem;
      padding: 5px 10px;
      height: 32px;
    }
    .fb-toolbar input[type="text"] { width: 220px; }
    .fb-toolbar input[type="date"] { width: 138px; }
    .fb-toolbar label {
      font-size: 0.72rem;
      color: #888;
      white-space: nowrap;
    }
    .fb-toolbar .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Post card */
    .fb-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      margin-bottom: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .fb-card:hover { border-color: rgba(255,255,255,0.2); }
    .fb-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }
    .fb-card-header:hover { background: rgba(255,255,255,0.03); }

    .fb-avatar {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(74,172,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4aacff;
    }
    .fb-card-body { flex: 1 1 0; min-width: 0; }
    .fb-author-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .fb-author-name {
      font-size: 0.88rem;
      font-weight: 500;
      color: #e0e0e0;
    }
    .fb-page-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(74,172,255,0.15);
      color: #4aacff;
      white-space: nowrap;
    }
    .fb-timestamp {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #888;
    }
    .fb-post-text {
      font-size: 0.82rem;
      color: #bbb;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
    }
    .fb-engagement {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .fb-eng-item {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #777;
    }
    .fb-eng-item span { color: #aaa; margin-right: 2px; }
    .fb-shared-badge {
      font-size: 0.68rem;
      color: #c49b3f;
      margin-top: 4px;
    }
    .fb-chevron {
      flex: 0 0 auto;
      color: #555;
      font-size: 0.9rem;
      transition: transform 0.2s;
      padding-top: 2px;
    }
    .fb-card.expanded .fb-chevron { transform: rotate(90deg); }

    /* Post detail */
    .fb-detail {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .fb-card.expanded .fb-detail { display: block; }
    .fb-detail-actions {
      display: flex;
      gap: 8px;
      padding: 10px 0 12px;
      align-items: center;
    }
    .fb-detail-actions a {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #4aacff;
      text-decoration: none;
      padding: 3px 8px;
      border: 1px solid rgba(74,172,255,0.3);
      border-radius: 3px;
    }
    .fb-detail-actions a:hover { background: rgba(74,172,255,0.1); }
    .fb-full-text {
      font-size: 0.82rem;
      color: #c8c8c8;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
      overflow-y: auto;
      padding: 10px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .fb-media-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .fb-media-strip img {
      height: 90px;
      width: auto;
      border-radius: 4px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.15s;
    }
    .fb-media-strip img:hover { opacity: 1; }

    /* Comments section */
    .fb-comments-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .fb-comments-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .fb-comment {
      padding: 6px 0 6px 12px;
      border-left: 2px solid rgba(255,255,255,0.06);
      margin-bottom: 6px;
    }
    .fb-comment-author {
      font-size: 0.76rem;
      font-weight: 500;
      color: #ccc;
    }
    .fb-comment-text {
      font-size: 0.78rem;
      color: #aaa;
      line-height: 1.4;
      margin-top: 2px;
    }
    .fb-comment-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      color: #666;
      margin-top: 2px;
    }

    /* Pagination */
    .pagination-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 0 4px;
      font-size: 0.78rem;
      color: #888;
    }
    .pagination-bar button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      color: #ccc;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 4px 12px;
    }
    .pagination-bar button:disabled { opacity: 0.35; cursor: default; }
    .pagination-bar button:not(:disabled):hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body class="page-index">

  <header class="app-header">
    <div class="header-brand">
      <span class="brand-icon">&#x2B21;</span>
      <span class="brand-name">CIVIC MEDIA</span>
    </div>
    <div class="header-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/speakers" class="nav-link">Speakers</a>
      <a href="/articles" class="nav-link">News</a>
      <a href="/facebook" class="nav-link active">Facebook</a>
      <a href="/clips" class="nav-link">Clips</a>
      <button class="btn btn-ghost btn-sm" id="shutdown-btn" title="Shutdown server"
              style="margin-left:8px;font-size:1.1em;padding:4px 8px;">&#x23FB;</button>
    </div>
  </header>

  <main class="index-main">
    <div class="fb-layout">

      <!-- Page sidebar -->
      <aside class="fb-sidebar">
        <div class="fb-sidebar-title">Pages</div>
        <div id="page-list">
          <div class="fb-page-item active" data-page="">
            <span>All pages</span>
          </div>
        </div>
      </aside>

      <!-- Main content -->
      <div class="fb-main">
        <div class="section-header">
          <h2>Facebook Posts</h2>
          <span class="meeting-count" id="post-count">&mdash;</span>
        </div>

        <!-- Filters -->
        <div class="fb-toolbar">
          <div class="toolbar-group">
            <input type="text" id="search-input" placeholder="Search posts &amp; authors…" />
          </div>
          <div class="toolbar-group">
            <label>From</label>
            <input type="date" id="date-from" />
          </div>
          <div class="toolbar-group">
            <label>To</label>
            <input type="date" id="date-to" />
          </div>
          <button class="btn btn-sm" id="filter-btn" style="height:32px;">Filter</button>
          <button class="btn btn-ghost btn-sm" id="clear-btn" style="height:32px;">Clear</button>
        </div>

        <!-- Post list -->
        <div id="posts-list">
          <div class="loading-state">Loading posts…</div>
        </div>

        <!-- Pagination -->
        <div class="pagination-bar" id="pagination-bar" style="display:none;">
          <button id="prev-btn">&larr; Prev</button>
          <span id="page-info"></span>
          <button id="next-btn">Next &rarr;</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.getElementById("shutdown-btn").addEventListener("click", async () => {
      if (!confirm("Shut down Civic Media server?")) return;
      try { await fetch("/api/system/shutdown", { method: "POST" }); } catch {}
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#888;"><div style="text-align:center"><h2>Server stopped</h2><p>Close this tab or restart with .\\start.ps1</p></div></div>';
    });
  </script>
  <script src="/static/facebook.js"></script>
</body>
</html>
