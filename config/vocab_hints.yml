# config/vocab_hints.yml
#
# Vocabulary hints fed to Whisper as initial_prompt.
# Add terms here to improve transcription accuracy for names, places,
# and acronyms common in Redding-area civic meetings.
#
# Categories:
#   people    - council members, staff, speakers
#   places    - streets, neighborhoods, landmarks
#   agencies  - departments, districts, organizations
#   acronyms  - abbreviations Whisper commonly gets wrong
#   programs  - named initiatives, funds, projects
#   other     - anything else
#
# Set active: false to exclude a term without deleting it.
# Terms are deduplicated and sorted before building the prompt.

global_terms:

  people:
    - term: "Jared Huffman"
      active: true
    - term: "Michael Dacquisto"
      active: true
