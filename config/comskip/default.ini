; Default Comskip configuration for TV news recordings.
; Place station-specific configs in this directory as {station_name}.ini
; e.g. krcr.ini, khsl.ini

[Main Settings]
detect_method=111
verbose=0
max_brightness=60
max_avg_brightness=25
max_commercialbreak=600
min_commercialbreak=4
max_commercial_gap=30
min_show_segment=60

[Detailed Settings]
added_recording=0

[Output Control]
output_edl=1
output_default=0
